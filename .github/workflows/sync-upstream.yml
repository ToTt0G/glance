name: Sync upstream glanceapp/glance

# Merge stable main only. Workflow files stay fork-local so GITHUB_TOKEN
# never needs permission to change workflows. Bot pushes do not trigger
# push workflows, so deployment is called explicitly after a successful push.
on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC, away from the busy hour boundary
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test sync behavior
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Merge upstream main, preserving fork workflows
        id: merge
        run: bash .github/scripts/sync-upstream.sh

      - name: Push to fork main
        id: push
        if: steps.merge.outputs.conflict != 'true'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            git push origin HEAD:main
          fi

      - name: Report merge conflicts
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Upstream merge conflicted. See the run summary; nothing was pushed or deployed.');

  deploy:
    needs: sync
    # Retry deployment even when the preceding run already pushed the merge.
    if: needs.sync.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    secrets: inherit

  report-failure:
    needs: [sync, deploy]
    if: always() && (needs.sync.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open one actionable failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Glance upstream sync or deployment failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', creator: 'github-actions[bot]'
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body: `Automatic upstream sync or deployment failed. Review the [failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nScheduled runs retry deployment even when the fork is already current. Code conflicts require a manual merge; fork customizations are never discarded automatically.`
              });
            }
