name: Sync upstream glanceapp/glance

# Merge stable main only. Workflow files stay fork-local so GITHUB_TOKEN
# never needs permission to change workflows. Bot pushes do not trigger
# push workflows, so deployment is called explicitly after a successful push.
on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC, away from the busy hour boundary
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main, preserving fork workflows
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/glanceapp/glance.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi

          # Stop before committing, even for a possible fast-forward.
          # Restore the entire directory, including additions/deletions,
          # before checking for genuine conflicts outside workflow files.
          merge_status=0
          git merge --no-commit --no-ff upstream/main || merge_status=$?
          git restore --source=HEAD --staged --worktree -- .github/workflows
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ]; then
            {
              echo '### Upstream sync blocked by merge conflicts'
              echo '```'
              printf '%s\n' "$conflicts"
              echo '```'
              echo 'Merge upstream/main manually. No changes were pushed or deployed.'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A non-conflict Git failure must not be mistaken for success.
          if ! git rev-parse --verify MERGE_HEAD >/dev/null; then
            echo "Merge failed with status $merge_status without a merge to commit." >&2
            exit 1
          fi
          git commit --no-edit
          git diff --exit-code origin/main HEAD -- .github/workflows

      - name: Push to fork main
        id: push
        if: steps.merge.outputs.conflict != 'true'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflicts
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Upstream merge conflicted. See the run summary; nothing was pushed or deployed.');
            const { data: repo } = await github.rest.repos.get(context.repo);
            if (!repo.has_issues) {
              core.warning('Repository Issues are disabled. Conflict details are in the run summary.');
              return;
            }
            const title = 'Upstream sync conflict';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', creator: 'github-actions[bot]'
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body: `The upstream/main merge conflicted. No changes were pushed or deployed.\n\nSee the [run summary](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for conflicting paths.`
              });
            }

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    secrets: inherit
