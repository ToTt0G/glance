name: Sync upstream glanceapp/glance

# Keeps this single-branch fork up to date with upstream `main` (stable).
# Upstream `dev` is intentionally ignored: it is experimental and currently
# diverged by an accidental mass-revert on upstream `main` (see README).
# Pushing to `main` triggers deploy.yml (GHCR build + Dokploy webhook).
#
# Workflow files (.github/workflows) are kept fork-local on purpose:
# deploy.yml and this sync workflow are fork-specific, and release.yaml
# stays pinned to the fork's copy. The GITHUB_TOKEN is a GitHub App and
# GitHub refuses pushes that create or update workflow files with it
# ("refusing to allow a GitHub App to create or update workflow ...
# without `workflows` permission", see run failures before 2026-10-24).
# To keep daily merges pushable, .github/workflows is always reset to the
# fork's current state before the merge commit is finalized, so the pushed
# commit never contains workflow-file changes. Do not commit workflow
# changes from upstream here.
on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push the merged result to main
  issues: write # open an actionable issue if the upstream merge conflicts

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/glanceapp/glance.git 2>/dev/null || true
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            echo "MERGED=true" >> "$GITHUB_ENV"
          else
            echo "MERGED=false" >> "$GITHUB_ENV"
            git merge --abort || true
          fi

      - name: Drop upstream changes to .github/workflows
        if: env.MERGED == 'true'
        run: |
          # See header comment: fork keeps its own workflow files and the
          # GITHUB_TOKEN cannot push workflow-file changes anyway. Restoring
          # them makes the merge commit workflow-free, so the push succeeds.
          if git diff --quiet --no-ext-diff origin/main..HEAD -- .github/workflows; then
            echo "Upstream did not change workflow files."
          else
            echo "Restoring .github/workflows from origin/main."
            git checkout origin/main -- .github/workflows
            git commit --amend --no-edit
          fi

      - name: Push to fork main
        if: env.MERGED == 'true'
        run: |
          # Only push if upstream brought something new
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main
          else
            echo "Already up to date, nothing to push."
          fi

      - name: Open issue on conflict
        if: env.MERGED == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream sync conflict ${new Date().toISOString().slice(0,10)}`,
              body: 'Daily `upstream/main` merge conflicted and was aborted. Merge manually:\n\n```\ngit fetch upstream main\ngit merge upstream/main\n```\nNo code was pushed; deploy was not triggered.'
            });
