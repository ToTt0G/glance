name: Build, Push to GHCR, and Deploy

on:
  push:
    branches:
      - main

  workflow_call:
    inputs:
      ref:
        description: Exact merged commit to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Shared by direct pushes and sync's reusable-workflow call.
    concurrency:
      group: glance-production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record image revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require deployment webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: test -n "$DOKPLOY_WEBHOOK_URL" || { echo "::error::DOKPLOY_WEBHOOK_URL is missing"; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo name
        id: string
        run: |
          echo "repo_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_name }}:${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish latest only for current main
        id: publish
        env:
          IMAGE: ghcr.io/${{ steps.string.outputs.repo_name }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: bash .github/scripts/publish-current-image.sh

      - name: Trigger Dokploy Webhook
        if: steps.publish.outputs.current == 'true'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$DOKPLOY_WEBHOOK_URL"
